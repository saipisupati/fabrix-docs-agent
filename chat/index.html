<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fabrix Docs Agent</title>
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b1020;
        --bg-elevated: #172033;
        --surface: #1e2a45;
        --surface-user: #243352;
        --border: rgba(255, 255, 255, 0.1);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.55);
        --muted2: rgba(255, 255, 255, 0.42);
        --accent: #f05a28;
        --accent-hover: #e84e1b;
        --danger: #fb7185;
        --shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        --radius-lg: 20px;
        --radius-md: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial,
          "Apple Color Emoji", "Segoe UI Emoji";
        background: linear-gradient(180deg, var(--bg) 0%, var(--bg-elevated) 100%);
        color: var(--text);
        font-size: 15px;
        line-height: 1.6;
      }

      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
        max-width: 768px;
        margin: 0 auto;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        box-shadow: inset 0 -1px 0 rgba(240, 90, 40, 0.2);
        flex-shrink: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand img {
        height: 22px;
        width: auto;
        flex-shrink: 0;
      }

      .titleBlock {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
        min-width: 0;
      }

      .title {
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.1px;
      }

      .subtitle {
        font-size: 11px;
        color: var(--muted2);
        letter-spacing: 0.2px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        user-select: none;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.3);
      }

      .dot.ok {
        background: var(--accent);
      }

      .dot.bad {
        background: var(--danger);
      }

      .messages {
        flex: 1 1 auto;
        overflow: auto;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        scroll-behavior: smooth;
      }

      .row {
        display: flex;
        max-width: 100%;
        animation: fadeIn 150ms ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .row.user {
        justify-content: flex-end;
      }

      .row.agent {
        justify-content: flex-start;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .bubble {
        max-width: 85%;
        border-radius: var(--radius-md);
        padding: 10px 14px;
        overflow-wrap: anywhere;
      }

      .bubble.user {
        background: var(--surface-user);
        color: var(--text);
      }

      .bubble.agent {
        background: transparent;
        padding: 0;
        max-width: 100%;
      }

      .bubble.error {
        background: rgba(251, 113, 133, 0.1);
        border: 1px solid rgba(251, 113, 133, 0.25);
        padding: 10px 14px;
        max-width: 100%;
      }

      .md strong {
        font-weight: 600;
      }

      .md .req {
        color: var(--accent);
        font-weight: 600;
        margin-left: 1px;
      }

      .md code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        font-size: 0.9em;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        padding: 2px 6px;
      }

      .md a {
        color: var(--accent);
        text-decoration: none;
      }

      .md a:hover {
        text-decoration: underline;
      }

      .md ul,
      .md ol {
        margin: 8px 0;
        padding-left: 20px;
      }

      .md li {
        margin: 4px 0;
      }

      .md p {
        margin: 0 0 8px;
      }

      .md p:last-child {
        margin-bottom: 0;
      }

      .typing {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 14px;
      }

      .dots {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }

      .dots span {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--accent);
        animation: bounce 1.2s infinite ease-in-out;
      }

      .dots span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .dots span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        30% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }

      .actions {
        display: flex;
        gap: 4px;
        opacity: 0.7;
        transition: opacity 0.15s;
      }

      .row.agent:hover .actions {
        opacity: 1;
      }

      .actionBtn {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 8px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .actionBtn:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
      }

      .sourcesBlock {
        margin-top: 12px;
        width: 100%;
      }

      .metaBlock {
        margin-top: 10px;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.03);
      }

      .metaBlock.gaps {
        border-color: rgba(240, 90, 40, 0.2);
        opacity: 0.92;
      }

      .metaList {
        margin: 0;
        padding-left: 18px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .metaList li {
        margin: 4px 0;
      }

      .inferFooter {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted2);
        font-style: italic;
        line-height: 1.4;
      }

      .sourcesLabel {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted2);
        margin-bottom: 8px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .chip {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--accent);
        font-size: 12px;
        font-weight: 500;
        padding: 5px 10px;
        border-radius: 999px;
        cursor: pointer;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition: background 0.12s, border-color 0.12s;
      }

      .chip:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(240, 90, 40, 0.35);
      }

      .chip.more {
        color: var(--muted);
        border-style: dashed;
      }

      .viewAllBtn {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        padding: 6px 0;
        margin-top: 6px;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .viewAllBtn:hover {
        color: var(--text);
      }

      .sourcesPanel {
        display: none;
        margin-top: 10px;
        flex-direction: column;
        gap: 8px;
      }

      .sourcesPanel.open {
        display: flex;
      }

      .sourceItem {
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.03);
      }

      .sourceLink {
        color: var(--accent);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
      }

      .sourceLink:hover {
        text-decoration: underline;
      }

      .excerpt {
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted2);
        line-height: 1.45;
        display: none;
      }

      .excerpt.open {
        display: block;
      }

      .toggleBtn {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        padding: 4px 0;
        margin-top: 4px;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .toggleBtn:hover {
        color: var(--text);
      }

      .composerWrap {
        flex-shrink: 0;
        padding: 12px 20px 20px;
        border-top: 1px solid var(--border);
      }

      .composer {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 10px 12px 10px 16px;
        box-shadow: var(--shadow);
        transition: border-color 0.15s;
      }

      .composer:focus-within {
        border-color: rgba(240, 90, 40, 0.4);
      }

      textarea {
        flex: 1 1 auto;
        resize: none;
        min-height: 24px;
        max-height: 140px;
        border: none;
        background: transparent;
        color: var(--text);
        font-family: inherit;
        font-size: 15px;
        line-height: 1.5;
        outline: none;
        padding: 4px 0;
      }

      textarea::placeholder {
        color: var(--muted2);
      }

      .sendBtn {
        appearance: none;
        flex: 0 0 auto;
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background 0.12s, opacity 0.12s;
      }

      .sendBtn:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      .sendBtn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .cancelBtn {
        appearance: none;
        flex: 0 0 auto;
        height: 36px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        display: none;
      }

      .cancelBtn.visible {
        display: inline-flex;
        align-items: center;
      }

      .cancelBtn:hover {
        color: var(--text);
        border-color: var(--muted);
      }

      .elapsed {
        color: var(--muted2);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        margin-left: 6px;
      }

      .sendBtn svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      .hint {
        margin-top: 8px;
        color: var(--muted2);
        font-size: 11px;
        text-align: center;
      }

      .hint.hidden {
        display: none;
      }

      .footer {
        padding: 0 20px 12px;
        text-align: center;
        font-size: 11px;
        color: var(--muted2);
        flex-shrink: 0;
      }

      @media (max-width: 520px) {
        .header {
          padding: 12px 16px;
        }
        .messages {
          padding: 16px;
        }
        .composerWrap {
          padding: 10px 16px 16px;
        }
        .bubble.user {
          max-width: 92%;
        }
        .status span:last-child {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <img
            src="https://fabrix.ai/images/logo-light.svg"
            alt="Fabrix"
            width="120"
            height="22"
          />
          <div class="titleBlock">
            <div class="title">Docs Agent</div>
            <div class="subtitle">Ask Fabrix documentation</div>
          </div>
        </div>
        <div class="status" title="API status">
          <span id="statusDot" class="dot" aria-hidden="true"></span>
          <span id="statusText">Connecting</span>
        </div>
      </header>

      <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions"></div>

      <div class="composerWrap">
        <div class="composer">
          <textarea
            id="input"
            placeholder="Write a message..."
            rows="1"
            aria-label="Message input"
          ></textarea>
          <button id="cancelBtn" class="cancelBtn" type="button" aria-label="Cancel request">
            Cancel
          </button>
          <button id="sendBtn" class="sendBtn" type="button" aria-label="Send message">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
            </svg>
          </button>
        </div>
        <div id="hint" class="hint">
          Press Enter to send, Shift+Enter for newline
        </div>
      </div>

      <div class="footer">Answers are generated from Fabrix documentation. Verify important details.</div>
    </div>

    <script>
      // Optional override before this script runs:
      // window.FabrixChatConfig = { apiUrl: "https://your-host", apiKey: "..." };
      const chatConfig = window.FabrixChatConfig || {};

      function resolveApiUrl() {
        const configured = (chatConfig.apiUrl ?? "").replace(/\/$/, "");
        if (configured) return configured;
        if (window.location.protocol === "file:") return "http://localhost:8080";
        const host = window.location.hostname;
        if (host === "localhost" || host === "127.0.0.1") {
          if (window.location.port === "8080") return window.location.origin;
          return "http://localhost:8080";
        }
        return window.location.origin;
      }

      const API_URL = resolveApiUrl();
      const MAX_CHIPS = 3;
      const EXCERPT_TRUNCATE = 300;

      function askHeaders() {
        const headers = { "Content-Type": "application/json" };
        if (chatConfig.apiKey) headers["X-API-Key"] = chatConfig.apiKey;
        return headers;
      }

      const messagesEl = document.getElementById("messages");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("sendBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const statusDot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");
      let activeAbort = null;
      let elapsedTimer = null;
      const hintEl = document.getElementById("hint");

      let hasSent = false;

      function escapeHtml(input) {
        return String(input)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function decodeEntities(s) {
        return s
          .replaceAll("&amp;", "&")
          .replaceAll("&lt;", "<")
          .replaceAll("&gt;", ">")
          .replaceAll("&quot;", '"')
          .replaceAll("&#039;", "'");
      }

      function renderParamBold(s) {
        // **name**: optional, **name** *: required, **name***: legacy (star inside delimiters)
        return s
          .replace(
            /\*\*([^*]+)\*\*(?: \*|\*)(?=:)/g,
            '<strong>$1</strong><span class="req" aria-label="required">*</span>'
          )
          .replace(/\*\*([^*]+)\*(?=:)/g, '<strong>$1</strong><span class="req" aria-label="required">*</span>')
          .replace(/\*\*([^*]+)\*\*(?=:)/g, "<strong>$1</strong>");
      }

      function renderInlineMarkdown(s) {
        s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
        s = renderParamBold(s);
        s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        s = s.replace(
          /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
          '<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>'
        );
        return s;
      }

      function renderBasicMarkdown(input) {
        let text = decodeEntities(escapeHtml(input ?? ""));
        const lines = text.split("\n");
        const out = [];
        let i = 0;

        const isUl = (ln) => /^[-*]\s+(.+)$/.test(ln);
        const isOl = (ln) => /^\d+\.\s+(.+)$/.test(ln);
        const isContinuation = (ln) => {
          if (!ln || !ln.trim()) return false;
          if (isUl(ln) || isOl(ln)) return false;
          return true;
        };

        const consumeList = (ordered) => {
          const items = [];
          while (i < lines.length) {
            while (i < lines.length && lines[i].trim() === "") {
              let j = i + 1;
              while (j < lines.length && lines[j].trim() === "") j++;
              const next = j < lines.length ? lines[j] : "";
              if ((ordered && isOl(next)) || (!ordered && isUl(next))) {
                i = j;
                continue;
              }
              return items;
            }
            if (i >= lines.length) break;

            if (ordered) {
              if (!isOl(lines[i])) break;
              const m = lines[i].match(/^(\d+)\.\s+(.+)$/);
              const parts = [m[2]];
              const num = m[1];
              i++;
              while (i < lines.length) {
                if (lines[i].trim() === "") {
                  let j = i + 1;
                  while (j < lines.length && lines[j].trim() === "") j++;
                  const next = j < lines.length ? lines[j] : "";
                  if (isOl(next) || isUl(next)) break;
                  if (isContinuation(next)) {
                    parts.push(next.trim());
                    i = j + 1;
                    continue;
                  }
                  break;
                }
                if (isOl(lines[i]) || isUl(lines[i])) break;
                if (isContinuation(lines[i])) {
                  parts.push(lines[i].trim());
                  i++;
                  continue;
                }
                break;
              }
              items.push(
                '<li value="' + num + '">' + renderInlineMarkdown(parts.join(" ")) + "</li>"
              );
            } else {
              if (!isUl(lines[i])) break;
              const m = lines[i].match(/^[-*]\s+(.+)$/);
              const parts = [m[1]];
              i++;
              while (
                i < lines.length &&
                lines[i].trim() !== "" &&
                !isUl(lines[i]) &&
                !isOl(lines[i]) &&
                isContinuation(lines[i])
              ) {
                parts.push(lines[i].trim());
                i++;
              }
              items.push("<li>" + renderInlineMarkdown(parts.join(" ")) + "</li>");
            }
          }
          return items;
        };

        while (i < lines.length) {
          const line = lines[i];

          if (isUl(line)) {
            const items = consumeList(false);
            if (items.length) out.push("<ul>" + items.join("") + "</ul>");
            continue;
          }

          if (isOl(line)) {
            const items = consumeList(true);
            if (items.length) {
              const startMatch = items[0].match(/value="(\d+)"/);
              const start = startMatch ? startMatch[1] : "1";
              const startAttr = start !== "1" ? ' start="' + start + '"' : "";
              out.push("<ol" + startAttr + ">" + items.join("") + "</ol>");
            }
            continue;
          }

          if (line.trim() === "") {
            i++;
            continue;
          }

          out.push("<p>" + renderInlineMarkdown(line) + "</p>");
          i++;
        }

        return out.join("");
      }

      function setStatus(state, label) {
        statusText.textContent = label;
        statusDot.classList.remove("ok", "bad");
        if (state === "ok") statusDot.classList.add("ok");
        if (state === "bad") statusDot.classList.add("bad");
      }

      function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function el(tag, className, text) {
        const n = document.createElement(tag);
        if (className) n.className = className;
        if (typeof text === "string") n.textContent = text;
        return n;
      }

      function truncate(str, max) {
        if (!str || str.length <= max) return str;
        return str.slice(0, max).trim() + "...";
      }

      function renderMetaList(label, items, container, className) {
        if (!items || !items.length) return;
        const block = el("div", "metaBlock" + (className ? " " + className : ""));
        block.appendChild(el("div", "sourcesLabel", label));
        const list = el("ul", "metaList");
        for (const item of items.slice(0, 6)) {
          list.appendChild(el("li", "", String(item)));
        }
        block.appendChild(list);
        container.appendChild(block);
      }

      function renderSources(sources, container) {
        if (!sources || !sources.length) return;

        const block = el("div", "sourcesBlock");
        block.appendChild(el("div", "sourcesLabel", "Sources"));

        const chips = el("div", "chips");
        const shown = sources.slice(0, MAX_CHIPS);
        for (const s of shown) {
          const chip = el("button", "chip", truncate(s.title || s.url || "Source", 28));
          chip.type = "button";
          chip.title = s.title || s.url;
          chip.addEventListener("click", () => window.open(s.url, "_blank", "noreferrer"));
          chips.appendChild(chip);
        }
        if (sources.length > MAX_CHIPS) {
          const more = el("button", "chip more", "+" + (sources.length - MAX_CHIPS) + " more");
          more.type = "button";
          more.addEventListener("click", () => {
            panel.classList.add("open");
            viewAllBtn.textContent = "Hide sources";
          });
          chips.appendChild(more);
        }
        block.appendChild(chips);

        const viewAllBtn = el("button", "viewAllBtn", "View all sources");
        viewAllBtn.type = "button";
        const panel = el("div", "sourcesPanel");

        for (const s of sources) {
          const item = el("div", "sourceItem");
          const a = el("a", "sourceLink", s.title || s.url || "Source");
          a.href = s.url || "#";
          a.target = "_blank";
          a.rel = "noreferrer noopener";
          item.appendChild(a);

          if (s.excerpt) {
            const full = s.excerpt;
            const short = truncate(full, EXCERPT_TRUNCATE);
            const excerpt = el("div", "excerpt", short);
            const toggle = el("button", "toggleBtn", "Show excerpt");
            toggle.type = "button";
            let expanded = false;
            let excerptOpen = false;

            toggle.addEventListener("click", () => {
              excerptOpen = !excerptOpen;
              excerpt.classList.toggle("open", excerptOpen);
              toggle.textContent = excerptOpen ? "Hide excerpt" : "Show excerpt";
            });

            if (full.length > EXCERPT_TRUNCATE) {
              const moreBtn = el("button", "toggleBtn", "Show more");
              moreBtn.type = "button";
              moreBtn.addEventListener("click", () => {
                expanded = !expanded;
                excerpt.textContent = expanded ? full : short;
                moreBtn.textContent = expanded ? "Show less" : "Show more";
                if (!excerptOpen) {
                  excerptOpen = true;
                  excerpt.classList.add("open");
                  toggle.textContent = "Hide excerpt";
                }
              });
              item.appendChild(toggle);
              item.appendChild(excerpt);
              item.appendChild(moreBtn);
            } else {
              item.appendChild(toggle);
              item.appendChild(excerpt);
            }
          }
          panel.appendChild(item);
        }

        viewAllBtn.addEventListener("click", () => {
          const open = panel.classList.toggle("open");
          viewAllBtn.textContent = open ? "Hide sources" : "View all sources";
        });

        block.appendChild(viewAllBtn);
        block.appendChild(panel);
        container.appendChild(block);
      }

      function addMessage({ role, text, sources, examples, gaps, usedInference, isError, isLoading }) {
        const row = el("div", "row " + role);
        const content = el("div", "bubble " + role + (isError ? " error" : ""));

        if (isLoading) {
          const typing = el("div", "typing");
          const dots = el("div", "dots");
          dots.innerHTML = "<span></span><span></span><span></span>";
          typing.appendChild(dots);
          typing.appendChild(el("span", "", "Searching docs"));
          const elapsed = el("span", "elapsed", "0.0s");
          elapsed.dataset.elapsed = "1";
          typing.appendChild(elapsed);
          content.appendChild(typing);
          row.appendChild(content);
        } else if (role === "agent") {
          content.classList.add("md");
          // Strip trailing disclosure from markdown; show as subtle footer instead
          let displayText = text || "";
          const disclosure = "Includes inferred Fabrix guidance not stated verbatim in the docs.";
          const hasDisclosure =
            usedInference ||
            displayText.toLowerCase().includes(disclosure.toLowerCase());
          if (hasDisclosure) {
            displayText = displayText
              .replace(/\*?Includes inferred Fabrix guidance not stated verbatim in the docs\.?\*?/gi, "")
              .trim();
          }
          content.innerHTML = renderBasicMarkdown(displayText);
          row.appendChild(content);

          if (!isError && hasDisclosure) {
            row.appendChild(
              el(
                "div",
                "inferFooter",
                "Includes inferred Fabrix guidance not stated verbatim in the docs."
              )
            );
          }

          // ChatGPT-style: Examples → Sources → Gaps (secondary)
          if (!isError) {
            renderMetaList("Examples", examples, row);
          }
          if (!isError && sources && sources.length) {
            renderSources(sources, row);
          }
          if (!isError) {
            renderMetaList("What the docs don’t cover", gaps, row, "gaps");
          }

          if (!isError && text) {
            const actions = el("div", "actions");
            const copyBtn = el("button", "actionBtn", "Copy");
            copyBtn.type = "button";
            copyBtn.addEventListener("click", async () => {
              try {
                await navigator.clipboard.writeText(text);
                copyBtn.textContent = "Copied";
                setTimeout(() => {
                  copyBtn.textContent = "Copy";
                }, 1500);
              } catch (_) {
                copyBtn.textContent = "Failed";
              }
            });
            actions.appendChild(copyBtn);
            row.appendChild(actions);
          }
        } else {
          content.textContent = text || "";
          row.appendChild(content);
        }

        messagesEl.appendChild(row);
        scrollToBottom();
        return row;
      }

      function formatError(errText) {
        return (
          "Request failed. " +
          (errText ? errText : "Check that the API is running and API_URL is correct.")
        );
      }

      async function healthCheck() {
        try {
          const r = await fetch(API_URL.replace(/\/$/, "") + "/health", {
            method: "GET",
            cache: "no-store",
          });
          if (!r.ok) throw new Error("HTTP " + r.status);
          setStatus("ok", "Connected");
        } catch (e) {
          setStatus("bad", "Offline");
        }
      }

      function autoGrow(elm) {
        elm.style.height = "auto";
        elm.style.height = Math.min(elm.scrollHeight, 140) + "px";
      }

      async function sendMessage() {
        const question = (inputEl.value || "").trim();
        if (!question) return;
        if (activeAbort) return;

        if (!hasSent) {
          hasSent = true;
          hintEl.classList.add("hidden");
        }

        inputEl.value = "";
        autoGrow(inputEl);
        inputEl.focus();

        addMessage({ role: "user", text: question });
        sendBtn.disabled = true;
        inputEl.disabled = true;
        cancelBtn.classList.add("visible");

        const loadingRow = addMessage({ role: "agent", isLoading: true });
        const started = performance.now();
        const elapsedEl = loadingRow.querySelector("[data-elapsed]");
        elapsedTimer = setInterval(() => {
          if (!elapsedEl) return;
          const sec = ((performance.now() - started) / 1000).toFixed(1);
          elapsedEl.textContent = sec + "s";
        }, 100);

        const controller = new AbortController();
        activeAbort = controller;

        try {
          const url = API_URL.replace(/\/$/, "") + "/ask";
          const res = await fetch(url, {
            method: "POST",
            headers: askHeaders(),
            body: JSON.stringify({ question }),
            signal: controller.signal,
          });

          if (!res.ok) {
            let details = "";
            try {
              const data = await res.json();
              details = data && (data.detail || JSON.stringify(data));
            } catch (_) {
              details = await res.text();
            }
            throw new Error(`HTTP ${res.status} ${details ? "- " + details : ""}`.trim());
          }

          const data = await res.json();
          const answer = data && typeof data.answer === "string" ? data.answer : "";
          const sources = data && Array.isArray(data.sources) ? data.sources : [];
          const examples = data && Array.isArray(data.examples) ? data.examples : [];
          const gaps = data && Array.isArray(data.gaps) ? data.gaps : [];
          const usedInference = !!(data && data.used_inference);

          loadingRow.remove();
          addMessage({
            role: "agent",
            text: answer || "(empty answer)",
            sources,
            examples,
            gaps,
            usedInference,
          });
          setStatus("ok", "Connected");
        } catch (e) {
          loadingRow.remove();
          if (e && e.name === "AbortError") {
            addMessage({ role: "agent", text: "Request cancelled.", isError: true });
            setStatus("ok", "Connected");
          } else {
            addMessage({ role: "agent", text: formatError(e && e.message ? e.message : ""), isError: true });
            setStatus("bad", "Error");
            console.error(e);
          }
        } finally {
          if (elapsedTimer) {
            clearInterval(elapsedTimer);
            elapsedTimer = null;
          }
          activeAbort = null;
          cancelBtn.classList.remove("visible");
          sendBtn.disabled = false;
          inputEl.disabled = false;
          inputEl.focus();
        }
      }

      cancelBtn.addEventListener("click", () => {
        if (activeAbort) activeAbort.abort();
      });

      sendBtn.addEventListener("click", () => void sendMessage());
      inputEl.addEventListener("input", () => autoGrow(inputEl));
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          void sendMessage();
        }
      });

      addMessage({
        role: "agent",
        text: 'Ask me anything about Fabrix docs. For example: "What parameters does the count loop bot take?"',
      });

      void healthCheck();
      setInterval(healthCheck, 15000);
    </script>
  </body>
</html>
