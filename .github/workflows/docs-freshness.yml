name: Docs freshness

# Weekly scrape → rebuild → Phase 1–5 gates. Does NOT run on every PR.
# On success, uploads fabrix_runtime_data.tar.gz for operators to refresh
# private RUNTIME_DATA_URL (do not publish as a public Release).

on:
  schedule:
    - cron: "0 8 * * 1" # Monday 08:00 UTC
  workflow_dispatch:

jobs:
  docs-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run freshness pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOCS_ROOT: ${{ github.workspace }}/data/docs_live_scrape
          PYTHONPATH: src
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ] || [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "API keys required for docs-freshness; failing job"
            exit 1
          fi
          python3 scripts/run_freshness_pipeline.py

      - name: Package runtime data
        if: success()
        run: |
          tar czf fabrix_runtime_data.tar.gz data/qdrant_db data/kb
          ls -lh fabrix_runtime_data.tar.gz

      - name: Upload runtime data artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fabrix-runtime-data
          path: fabrix_runtime_data.tar.gz
          retention-days: 14

      - name: Upload gate result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-freshness-results
          path: |
            tests/benchmark_phases_results.txt
            tests/eval_customer_bakeoff_results.txt
            data/scrape_manifest.json
          if-no-files-found: ignore
